modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/aesefficio/CreateInteriorsMod/issues"

[[mods]]
modId = "interiors"
version = "${version}"
displayName = "Create: Interiors"
# https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/interiors"
issueTrackerURL = "https://github.com/aesefficio/CreateInteriorsMod/issues"
logoFile="assets/interiors/icon.png"
credits = "rdh"
authors = "sudolev"
description = '''
Create: Interiors is a new take on furniture, adding functional blocks that mesh seamlessly with the aesthetic and principles of the Create mod.
'''

[[dependencies.interiors]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.interiors]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.interiors]]
modId = "create"
type = "required"
versionRange = "[${create_neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[modproperties.interiors]
catalogueImageIcon="icon.png"
catalogueBackground="mod_banner.png"
configuredBackground="create:textures/block/seat/top_red.png"
